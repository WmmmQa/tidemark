name: MoonBit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.15+943464bfa'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Format and refresh package interfaces
        run: |
          moon fmt
          moon info
          git diff --exit-code

      - name: Check native packages
        run: moon check --target native --deny-warn

      - name: Run pricing walkthrough
        run: moon run cmd/main --target native
