name: MoonBit checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s '0.10.20+65efd5b93'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Format and refresh package interfaces
        run: |
          moon fmt
          moon info
          git diff --exit-code
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            exit 1
          fi

      - name: Check native packages
        run: moon check --target native --deny-warn

      - name: Run calculation and JSON boundary tests
        run: moon test --target native --deny-warn

      - name: Check JS package execution
        run: moon test --target js --deny-warn

      - name: Check structured file workflows on native and JS
        run: |
          node scripts/check-examples.mjs native
          node scripts/check-examples.mjs js

      - name: Check separate MoonBit library consumer on native and JS
        run: node scripts/check-library-consumer.mjs native js

      - name: Verify worksheet CLI on native and JS
        shell: bash
        run: |
          model="$(cat examples/meter-balance.worksheet)"
          for target in native js; do
            output="$(moon run --target "$target" cmd/reconcile -- "$model" opening=100 closing=180 branch_a=35 branch_b=45 --edit closing=190 branch_b=55)"
            grep -Fq '"delivered":"90"' <<< "$output"
            if output="$(moon run --target "$target" cmd/reconcile -- "$model" opening=100 closing=180 branch_a=35 branch_b=45 --edit closing=190)"; then
              echo "Inconsistent edit unexpectedly succeeded" >&2
              exit 1
            fi
            grep -Fq '"error":"check-failed","line":2,"column":17' <<< "$output"
          done

      - name: Run portfolio import example
        shell: bash
        run: |
          result="$(moon run cmd/mix --target native)"
          printf '%s\n' "$result"
          grep -Fq 'Break-even: 191 bundles' <<< "$result"
          grep -Fq 'Target profit 800000 fen: 286 bundles' <<< "$result"
          grep -Fq 'Operating profit change (fen): -300000' <<< "$result"

      - name: Run pricing walkthrough
        run: moon run cmd/main --target native

      - name: Run custom scenario walkthrough
        shell: bash
        run: |
          result="$(moon run cmd/main --target native 8000 4800 1600000 700 7500 4800 1600000 700)"
          printf '%s\n' "$result"
          grep -Fq 'Operating profit change (fen): -350000' <<< "$result"

      - name: Check invalid scenario guidance
        shell: bash
        run: |
          result="$(moon run cmd/main --target native 8000 8000 1600000 700 7500 4800 1600000 700)"
          printf '%s\n' "$result"
          grep -Fq 'Selling price must exceed unit variable cost.' <<< "$result"
